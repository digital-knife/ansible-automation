---
- name: Install Nginx
  package:
    name: nginx
    state: present

- name: Deploy Dynamic Nginx Config
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/conf.d/default.conf
  notify: Restart Nginx

- name: Ensure Nginx is started and enabled
  service:
    name: nginx
    state: started
    enabled: yes
services:
  ubuntu:
    image: ubuntu:22.04
    container_name: test-ubuntu
    hostname: ubuntu-target
    privileged: true
    command: >
      /bin/bash -c "
      apt-get update -qq && 
      apt-get install -y -qq python3 openssh-server sudo &&
      mkdir -p /run/sshd /root/.ssh &&
      chmod 700 /root/.ssh &&
      cp /tmp/ssh-key.pub /root/.ssh/authorized_keys &&
      chmod 600 /root/.ssh/authorized_keys &&
      chown root:root /root/.ssh/authorized_keys &&
      echo 'PermitRootLogin prohibit-password' > /etc/ssh/sshd_config.d/hardening.conf &&
      echo 'PasswordAuthentication no' >> /etc/ssh/sshd_config.d/hardening.conf &&
      echo 'PubkeyAuthentication yes' >> /etc/ssh/sshd_config.d/hardening.conf &&
      /usr/sbin/sshd && tail -f /dev/null
      "
    ports:
      - "2223:22"
    volumes:
      - ../.ssh/ssh-key.pub:/tmp/ssh-key.pub:ro

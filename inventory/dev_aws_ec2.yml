plugin: amazon.aws.aws_ec2
regions:
  - us-east-1

#Ansible role for operations
#iam_role_arn: arn:aws:iam::315735600075:role/AnsibleInventoryRole
profile: test-automation-provisioner

filters:
  tag:Project: JR-Infrastructure
  instance-state-name: [ 'running' ]

# Automatically group hosts by their Tags and Environment
keyed_groups:
  - prefix: tag
    key: tags
  - prefix: env
    key: tags.Environment

# Use the Private IP for the connection
hostnames:
  - instance-id

compose:
  ansible_connection: "'community.aws.aws_ssm'"
  ansible_aws_ssm_profile: "'test-automation-provisioner'"
  ansible_aws_ssm_region: "'us-east-1'"
  ansible_user: "'ec2-user'"
  ansible_aws_ssm_bucket_name: "'jr-ansible-transfer-315735600075-dev'"

  